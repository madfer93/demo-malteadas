<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocina - Sipote Malteada</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/kitchen.css">
</head>
<body class="kitchen-body">
    <header class="kitchen-header">
        <h1>Cocina - Sipote Malteada</h1>
        <div class="kitchen-stats">
            <span id="pending-count">0 pendientes</span>
            <span id="preparing-count">0 preparando</span>
            <span id="current-time"></span>
        </div>
    </header>

    <main class="kitchen-main">
        <section class="kitchen-column">
            <h2 class="column-title pending">Nuevos</h2>
            <div class="orders-container" id="pending-orders"></div>
        </section>

        <section class="kitchen-column">
            <h2 class="column-title preparing">Preparando</h2>
            <div class="orders-container" id="preparing-orders"></div>
        </section>

        <section class="kitchen-column">
            <h2 class="column-title ready">Listos</h2>
            <div class="orders-container" id="ready-orders"></div>
        </section>
    </main>

    <audio id="notification-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/kitchen.js"></script>
</body>
</html>
